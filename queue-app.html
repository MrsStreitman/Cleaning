<title>SpruceCLE Waitlist</title>
<style>
  :root{
    --teal:#6FC7CF;
    --teal-deep:#2C8890;
    --teal-deeper:#1F656B;
    --lavender:#C9A2DE;
    --lavender-deep:#9B6BC2;
    --lavender-deeper:#7E4FA6;
    --paper:#F6FBFC;
    --card:#FFFFFF;
    --ink:#20393C;
    --ink-soft:#5C7C7F;
    --line:#DCEEF0;
    --go:#3FA772;
    --go-dark:#2F8259;
    --progress-bg:#F3EAF9;
    --progress-ink:#6E4A94;
    --done-bg:#E8F6F7;
    --done-ink:#1F656B;
    --text-bg:#E6F6F7;
    --text-ink:#1F656B;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);}
  body{-webkit-user-select:none;user-select:none;}
  input,textarea{-webkit-user-select:text;user-select:text;}

  header{
    background:var(--teal-deep);
    color:#fff;
    padding:14px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;top:0;z-index:20;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
    gap:16px;
  }
  header .brand{display:flex;align-items:center;gap:12px;min-width:0;}
  header .brand img{
    width:44px;height:44px;border-radius:50%;
    background:#fff;flex:0 0 auto;
    box-shadow:0 0 0 2px rgba(255,255,255,.5);
  }
  header .title{display:flex;flex-direction:column;min-width:0;}
  header h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px;line-height:1.2;}
  header .sub{font-size:12.5px;color:#DDF3F5;}
  header .stats{display:flex;gap:18px;font-size:13px;color:#DDF3F5;flex:0 0 auto;}
  header .stats b{color:#fff;font-size:18px;display:block;}
  header .stats div{text-align:center;}

  .wrap{
    display:grid;
    grid-template-columns:340px 1fr;
    gap:0;
    height:calc(100% - 72px);
    overflow:hidden;
  }
  @media (max-width:820px){
    .wrap{grid-template-columns:1fr;height:auto;}
  }

  .formPane{
    background:var(--card);
    border-right:1px solid var(--line);
    padding:20px;
    overflow-y:auto;
  }
  .formPane h2{font-size:15px;margin:0 0 14px;color:var(--ink);}
  label{display:block;font-size:12.5px;color:var(--ink-soft);margin:14px 0 6px;font-weight:600;}
  label:first-of-type{margin-top:0;}
  input[type=text],input[type=tel]{
    width:100%;padding:13px 12px;border:1.5px solid var(--line);border-radius:10px;
    font-size:16px;background:#FBFEFE;color:var(--ink);
  }
  input:focus{outline:none;border-color:var(--lavender-deep);background:#fff;}

  .segRow{display:flex;gap:8px;margin-top:2px;flex-wrap:wrap;}
  .seg{
    flex:1;min-width:90px;padding:11px 8px;text-align:center;border:1.5px solid var(--line);
    border-radius:10px;font-size:13.5px;font-weight:600;color:var(--ink-soft);background:#FBFEFE;
  }
  .seg.active{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff;}

  .addBtn{
    margin-top:20px;width:100%;padding:15px;background:var(--lavender-deep);color:#fff;border:none;
    border-radius:12px;font-size:16px;font-weight:700;box-shadow:0 3px 0 var(--lavender-deeper);
  }
  .addBtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--lavender-deeper);}
  .addBtn:disabled{background:#D8D2C4;box-shadow:0 3px 0 #C4BEB0;color:#8A8577;}

  .settings{
    margin-top:22px;padding-top:16px;border-top:1px dashed var(--line);
  }
  .settings label{margin-top:0;}
  .avgRow{display:flex;align-items:center;gap:10px;}
  .avgRow input{width:64px;text-align:center;padding:10px 4px;}
  .stepBtn{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:#FBFEFE;font-size:18px;font-weight:700;color:var(--ink);}

  .clearBtn{
    margin-top:16px;width:100%;padding:11px;background:none;border:1.5px solid var(--line);
    border-radius:10px;font-size:13px;color:var(--ink-soft);font-weight:600;
  }

  .queuePane{overflow-y:auto;padding:20px 22px 60px;}
  .colHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .colHead h2{font-size:15px;margin:0;color:var(--ink-soft);font-weight:700;letter-spacing:.2px;}

  .empty{
    margin-top:60px;text-align:center;color:var(--ink-soft);
  }
  .empty .big{font-size:44px;margin-bottom:10px;}
  .empty p{font-size:15px;max-width:320px;margin:8px auto 0;}

  .card{
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:16px;
    padding:16px 18px;
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:16px;
  }
  .card.status-progress{border-color:#DCC2EE;background:#FDFBFF;}
  .card.status-done{opacity:.65;}

  .posNum{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;
    background:var(--paper);border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:16px;color:var(--ink-soft);
  }
  .card.status-progress .posNum{background:var(--progress-bg);color:var(--progress-ink);border-color:#DCC2EE;}
  .card.status-done .posNum{background:var(--done-bg);color:var(--done-ink);border-color:#BEE3E5;}

  .cardMain{flex:1;min-width:0;}
  .nameRow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .name{font-size:17px;font-weight:700;color:var(--ink);}
  .tag{
    font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:20px;
    background:var(--paper);color:var(--ink-soft);border:1px solid var(--line);
  }
  .metaRow{display:flex;gap:14px;margin-top:5px;font-size:13px;color:var(--ink-soft);flex-wrap:wrap;}
  .waitPill{
    font-weight:700;padding:2px 0;
  }
  .waitPill.wait{color:var(--lavender-deeper);}
  .waitPill.progress{color:var(--progress-ink);}
  .waitPill.done{color:var(--done-ink);}

  .actions{flex:0 0 auto;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;}
  .aBtn{
    padding:10px 14px;border-radius:10px;font-size:13.5px;font-weight:700;border:none;white-space:nowrap;
  }
  .aBtn.start{background:var(--teal-deep);color:#fff;}
  .aBtn.done{background:var(--go);color:#fff;}
  .aBtn.text{background:var(--text-bg);color:var(--text-ink);}
  .aBtn.call{background:var(--text-bg);color:var(--text-ink);}
  .aBtn.undo{background:none;color:var(--ink-soft);border:1.5px solid var(--line);}
  .aBtn.remove{background:none;color:#B0453A;border:1.5px solid #EBD2CE;}

  ::-webkit-scrollbar{width:0;height:0;}
</style>
</head>

    <div class="title">
      <h1>SpruceCLE Waitlist</h1>
      <span class="sub">Car seat &amp; stroller cleaning</span>
    </div>
  </div>
  <div class="stats">
    <div><b id="statWaiting">0</b>waiting</div>
    <div><b id="statProgress">0</b>cleaning now</div>
    <div><b id="statDone">0</b>done today</div>
  </div>
</header>

<div class="wrap">

  <div class="formPane">
    <h2>Add a family</h2>

    <label for="fName">Name</label>
    <input type="text" id="fName" placeholder="First name + last initial" autocomplete="off">

    <label for="fPhone">Phone number</label>
    <input type="tel" id="fPhone" placeholder="(216) 555-0100" autocomplete="off">

    <label>What do they need?</label>
    <div class="segRow" id="itemSeg">
      <div class="seg active" data-val="Car seat">Car seat</div>
      <div class="seg" data-val="Stroller">Stroller</div>
      <div class="seg" data-val="Both">Both</div>
    </div>

    <button class="addBtn" id="addBtn">Add to waitlist</button>

    <div class="settings">
      <label>Minutes per clean (average)</label>
      <div class="avgRow">
        <button class="stepBtn" id="avgDown">–</button>
        <input type="text" id="avgMin" value="8" inputmode="numeric">
        <button class="stepBtn" id="avgUp">+</button>
        <span style="font-size:12.5px;color:var(--ink-soft);">used for wait times</span>
      </div>
    </div>

    <button class="clearBtn" id="clearBtn">Clear finished names &amp; start fresh</button>
  </div>

  <div class="queuePane">
    <div class="colHead"><h2>Today's waitlist</h2></div>
    <div id="list"></div>
  </div>

</div>

<script>
const STORAGE_KEY = 'quickCleanQueue_v1';
const AVG_KEY = 'quickCleanAvgMin_v1';

let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let avgMin = parseInt(localStorage.getItem(AVG_KEY) || '8', 10);
let selectedItem = 'Car seat';

const listEl = document.getElementById('list');
const nameEl = document.getElementById('fName');
const phoneEl = document.getElementById('fPhone');
const addBtn = document.getElementById('addBtn');
const avgMinEl = document.getElementById('avgMin');

function save(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  localStorage.setItem(AVG_KEY, String(avgMin));
}

function fmtPhone(raw){
  const d = raw.replace(/\D/g,'').slice(0,10);
  if(d.length < 4) return d;
  if(d.length < 7) return `(${d.slice(0,3)}) ${d.slice(3)}`;
  return `(${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6)}`;
}
phoneEl.addEventListener('input', e => {
  const pos = e.target.selectionStart;
  const before = e.target.value.length;
  e.target.value = fmtPhone(e.target.value);
  const after = e.target.value.length;
  e.target.selectionStart = e.target.selectionEnd = Math.max(0, pos + (after-before));
});

document.getElementById('itemSeg').addEventListener('click', e => {
  const seg = e.target.closest('.seg');
  if(!seg) return;
  document.querySelectorAll('#itemSeg .seg').forEach(s=>s.classList.remove('active'));
  seg.classList.add('active');
  selectedItem = seg.dataset.val;
});

document.getElementById('avgUp').onclick = () => { avgMin = Math.min(60, avgMin+1); avgMinEl.value = avgMin; save(); render(); };
document.getElementById('avgDown').onclick = () => { avgMin = Math.max(1, avgMin-1); avgMinEl.value = avgMin; save(); render(); };
avgMinEl.addEventListener('change', () => {
  let v = parseInt(avgMinEl.value,10);
  if(isNaN(v) || v < 1) v = 8;
  avgMin = Math.min(60, v);
  avgMinEl.value = avgMin;
  save(); render();
});

addBtn.onclick = () => {
  const name = nameEl.value.trim();
  const phone = phoneEl.value.trim();
  if(!name){ nameEl.focus(); return; }
  state.push({
    id: Date.now() + '-' + Math.random().toString(36).slice(2,7),
    name, phone, item: selectedItem,
    status: 'waiting',
    addedAt: Date.now(),
    startedAt: null,
    doneAt: null
  });
  nameEl.value = '';
  phoneEl.value = '';
  save();
  render();
  nameEl.focus();
};

document.getElementById('clearBtn').onclick = () => {
  if(!confirm('Remove all finished names and start a fresh waitlist?')) return;
  state = state.filter(p => p.status !== 'done');
  save();
  render();
};

function timeAgo(ts){
  const min = Math.max(0, Math.round((Date.now()-ts)/60000));
  if(min < 1) return 'just now';
  if(min === 1) return '1 min ago';
  return `${min} min ago`;
}

function estimateWaitMin(person, waitingList){
  const idx = waitingList.findIndex(p => p.id === person.id);
  if(idx === -1) return 0;
  const inProgressCount = state.filter(p=>p.status==='in-progress').length;
  const remainingCurrent = inProgressCount > 0 ? avgMin/2 : 0;
  return Math.round(remainingCurrent + idx*avgMin);
}

function smsHref(phone, name){
  const digits = phone.replace(/\D/g,'');
  const msg = encodeURIComponent(`Hi ${name.split(' ')[0]}, this is the SpruceCLE team — we're ready for you now! Please come on over.`);
  if(!digits) return null;
  return `sms:${digits}&body=${msg}`;
}
function telHref(phone){
  const digits = phone.replace(/\D/g,'');
  if(!digits) return null;
  return `tel:${digits}`;
}

function render(){
  const waiting = state.filter(p=>p.status==='waiting').sort((a,b)=>a.addedAt-b.addedAt);
  const progress = state.filter(p=>p.status==='in-progress').sort((a,b)=>a.startedAt-b.startedAt);
  const done = state.filter(p=>p.status==='done').sort((a,b)=>b.doneAt-a.doneAt);

  document.getElementById('statWaiting').textContent = waiting.length;
  document.getElementById('statProgress').textContent = progress.length;
  document.getElementById('statDone').textContent = done.length;

  const ordered = [...progress, ...waiting, ...done];

  if(ordered.length === 0){
    listEl.innerHTML = `
      <div class="empty">
        <div class="big">🧸</div>
        <p>No one on the list yet. Add a family on the left to get started.</p>
      </div>`;
    return;
  }

  listEl.innerHTML = ordered.map((p, i) => {
    let posLabel, waitLabel, waitClass, actionsHtml;
    const sms = smsHref(p.phone, p.name);
    const tel = telHref(p.phone);

    if(p.status === 'in-progress'){
      posLabel = '⏳';
      waitLabel = 'Cleaning now';
      waitClass = 'progress';
      actionsHtml = `
        <button class="aBtn done" data-act="finish" data-id="${p.id}">Mark done</button>
        <button class="aBtn undo" data-act="backToWait" data-id="${p.id}">Move back to waiting</button>`;
    } else if(p.status === 'done'){
      posLabel = '✓';
      waitLabel = `Done ${timeAgo(p.doneAt)}`;
      waitClass = 'done';
      actionsHtml = `<button class="aBtn remove" data-act="remove" data-id="${p.id}">Remove</button>`;
    } else {
      const waitIdx = waiting.findIndex(w=>w.id===p.id);
      posLabel = waitIdx + 1;
      const est = estimateWaitMin(p, waiting);
      waitLabel = est <= 0 ? "You're next" : `~${est} min wait`;
      waitClass = 'wait';
      actionsHtml = `
        <button class="aBtn start" data-act="start" data-id="${p.id}">Start clean</button>
        ${sms ? `<button class="aBtn text" data-act="text" data-id="${p.id}">Text</button>` : ''}
        ${tel ? `<button class="aBtn call" data-act="call" data-id="${p.id}">Call</button>` : ''}
        <button class="aBtn remove" data-act="remove" data-id="${p.id}">Remove</button>`;
    }

    return `
      <div class="card status-${p.status === 'in-progress' ? 'progress' : p.status}">
        <div class="posNum">${posLabel}</div>
        <div class="cardMain">
          <div class="nameRow">
            <span class="name">${escapeHtml(p.name)}</span>
            <span class="tag">${escapeHtml(p.item)}</span>
          </div>
          <div class="metaRow">
            <span>${p.phone ? escapeHtml(p.phone) : 'No phone given'}</span>
            <span class="waitPill ${waitClass}">${waitLabel}</span>
          </div>
        </div>
        <div class="actions">${actionsHtml}</div>
      </div>`;
  }).join('');
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

listEl.addEventListener('click', e => {
  const btn = e.target.closest('.aBtn');
  if(!btn) return;
  const id = btn.dataset.id;
  const person = state.find(p=>p.id===id);
  if(!person) return;
  const act = btn.dataset.act;

  if(act === 'start'){
    person.status = 'in-progress';
    person.startedAt = Date.now();
  } else if(act === 'finish'){
    person.status = 'done';
    person.doneAt = Date.now();
  } else if(act === 'backToWait'){
    person.status = 'waiting';
    person.startedAt = null;
  } else if(act === 'remove'){
    state = state.filter(p=>p.id!==id);
  } else if(act === 'text'){
    window.location.href = smsHref(person.phone, person.name);
  } else if(act === 'call'){
    window.location.href = telHref(person.phone);
  }
  save();
  render();
});

avgMinEl.value = avgMin;
render();
setInterval(render, 30000);
</script>

</body>
</html>
